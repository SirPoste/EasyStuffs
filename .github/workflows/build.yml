name: Build ImageUpdater

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build Windows exe
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ImageUpdater.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ImageUpdater
          path: image-updater/ImageUpdater.exe
